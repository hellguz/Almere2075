# ADDED: This is a new file.
# This Nginx configuration is specifically for the frontend container.
# Its purpose is to correctly serve the static React single-page application (SPA).
server {
    listen 80;
    server_name localhost;

    # Set the root directory where the built React files are located.
    root /usr/share/nginx/html;
    # Specify the default file to serve.
    index index.html index.htm;

    # This location block is the key for SPA routing.
    location / {
        # It tries to find a file that matches the exact URI ($uri).
        # If not found, it tries to find a directory with that name ($uri/).
        # If neither is found, it serves /index.html as a fallback.
        # This allows the client-side React router to handle the route (e.g., /slides).
        try_files $uri $uri/ /index.html;
    }

    # Optional: Add headers for caching static assets like CSS and JS.
    location ~* \.(?:css|js)$ {
        expires 1y;
        add_header Cache-Control "public";
    }
}
